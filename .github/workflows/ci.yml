name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "25.x"
          cache: yarn
          cache-dependency-path: 'yarn.lock'
          # cache: "pnpm"

      - name: Enable Corepack and Yarn 4.12.0
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate
        shell: bash

      - name: Run yarn install
        working-directory: ./web-ui
        run: |
          set -euo pipefail
          node .yarn/releases/yarn-4.12.0.cjs install --immutable
        shell: bash

      - name: Lint
        run: node .yarn/releases/yarn-4.12.0.cjs lint

      - name: Build
        run: node .yarn/releases/yarn-4.12.0.cjs build

      - name: Run Jest tests with coverage
        run: node .yarn/releases/yarn-4.12.0.cjs test:cover
